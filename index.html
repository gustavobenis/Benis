<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1d5436" />
    <meta name="description" content="Marieta: A Grande Aventura na Mata — uma aventura 3D de joaninha no navegador." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='18' r='12' fill='%23d92e3d'/%3E%3Ccircle cx='16' cy='8' r='6' fill='%23111'/%3E%3Ccircle cx='11' cy='19' r='2.5' fill='%23111'/%3E%3Ccircle cx='21' cy='19' r='2.5' fill='%23111'/%3E%3C/svg%3E" />
    <title>Marieta: A Grande Aventura na Mata</title>
  </head>
  <body>
    <div id="app">
      <canvas id="view" tabindex="0"></canvas>

      <div id="loading" class="screen">
        <h1 class="logo">Marieta</h1>
        <p class="tag">Carregando a mata…</p>
        <div class="bar"><i id="loadbar"></i></div>
        <p id="loaderr" class="err hidden" role="alert"></p>
      </div>

      <div id="menu" class="screen hidden">
        <div class="menu-card">
          <h1 class="logo">Marieta</h1>
          <p class="sub">Uma grande aventura na mata</p>
          <p class="tag">Pequena no tamanho, gigante no coração.</p>
          <button id="btn-new" class="btn primary">Novo jogo</button>
          <button id="btn-continue" class="btn" disabled>Continuar</button>
          <button id="btn-settings" class="btn">Configurações</button>
          <button id="btn-controls" class="btn">Como jogar</button>
          <p class="ver">Protótipo jogável · Fase 1 — O Jardim das Gotas</p>
        </div>
      </div>

      <div id="hud" class="hidden">
        <div id="objective" class="panel"><small id="obj-quest"></small><b id="obj-text"></b><div class="pbar hidden" id="obj-pbar"><i id="obj-bar"></i></div></div>
        <div id="items" class="panel"></div>
        <canvas id="minimap" width="96" height="160" aria-label="Mapa simplificado"></canvas>
        <div id="cam-label" class="chip"></div>
        <div id="top-btns">
          <button id="b-camera" class="icon" aria-label="Alternar câmera">🎥</button>
          <button id="b-pause" class="icon" aria-label="Pausar">⏸</button>
        </div>
        <div id="prompt" class="panel hidden"></div>
        <div id="hint" class="panel hidden"></div>
        <div id="toast" class="panel hidden"></div>
        <div id="danger" aria-hidden="true"></div>
      </div>

      <div id="touch" class="hidden">
        <div id="joy-zone"></div>
        <div id="look-zone"></div>
        <div id="joy-base"><div id="joy-knob"></div></div>
        <button id="t-jump" class="tbtn big">⤒<small>Pular</small></button>
        <button id="t-interact" class="tbtn">✋<small>Agir</small></button>
        <button id="t-observe" class="tbtn small">👁<small>Observar</small></button>
      </div>

      <div id="dialogue" class="hidden" role="dialog" aria-live="polite">
        <div class="dlg-head"><span id="dlg-icon">🐌</span><b id="dlg-name"></b></div>
        <p id="dlg-text"></p>
        <span id="dlg-next">continuar ▸</span>
      </div>

      <div id="pause" class="screen hidden">
        <div class="sheet">
          <h2>Pausado</h2>
          <nav id="pause-nav">
            <button class="btn primary" data-act="resume">Continuar</button>
            <button class="btn" data-tab="inv">Inventário</button>
            <button class="btn" data-tab="journal">Diário de missões</button>
            <button class="btn" data-tab="map">Mapa</button>
            <button class="btn" data-act="settings">Configurações</button>
            <button class="btn" data-act="controls">Como jogar</button>
            <button class="btn danger" data-act="menu">Menu inicial</button>
          </nav>
          <div id="pause-body"></div>
        </div>
      </div>

      <div id="settings" class="screen hidden">
        <div class="sheet">
          <h2>Configurações</h2>
          <div id="settings-body"></div>
          <button class="btn primary" id="settings-close">Voltar</button>
        </div>
      </div>

      <div id="controls" class="screen hidden">
        <div class="sheet">
          <h2>Como jogar</h2>
          <div id="controls-body"></div>
          <button class="btn primary" id="controls-close">Voltar</button>
        </div>
      </div>

      <div id="complete" class="screen hidden">
        <div class="sheet center">
          <h2>Jardim concluído!</h2>
          <p id="complete-text"></p>
          <div id="complete-stats"></div>
          <button class="btn primary" id="complete-free">Explorar livremente</button>
          <button class="btn" id="complete-menu">Menu inicial</button>
        </div>
      </div>

      <div id="fade"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
